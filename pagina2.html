<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ranking de Técnicos</title>

<style>
body{
  font-family: Arial;
  background:#f5f7fa;
  padding:20px;
}

.container{
  max-width:800px;
  margin:auto;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
}

.top-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

#contador{
  font-weight:bold;
}

input{
  padding:8px;
  width:200px;
  border-radius:6px;
  border:1px solid #ccc;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th, td{
  padding:12px;
  text-align:left;
}

th{
  background:#2196F3;
  color:white;
}

tr:nth-child(even){
  background:#f2f2f2;
}

.top{
  background:#ffeaa7 !important;
  font-weight:bold;
}

.bola{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
}

.verde{ background:green; }
.amarelo{ background:orange; }
.vermelho{ background:red; }
.ouro{ background:gold; }
.prata{ background:silver; }
.bronze{ background:#cd7f32; }

.link{
  display:inline-block;
  margin-bottom:10px;
  text-decoration:none;
  color:#2196F3;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="container">
  <div class="card">

    <a href="tecnicos.html" class="link">← Voltar para técnicos</a>

    <h1>🏆 Ranking de Técnicos</h1>

    <div class="top-info">
      <div id="contador"></div>
      <input type="text" id="busca" placeholder="Buscar técnico...">
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Técnico</th>
          <th>Pontos</th>
        </tr>
      </thead>
      <tbody id="tabela">

        <!-- EXEMPLO MANUAL -->
        <tr class="top">
          <td>1</td>
          <td><span class="bola ouro"></span>João Silva</td>
          <td>250</td>
        </tr>

        <tr class="top">
          <td>2</td>
          <td><span class="bola prata"></span>Maria Souza</td>
          <td>210</td>
        </tr>

        <tr class="top">
          <td>3</td>
          <td><span class="bola bronze"></span>Carlos Lima</td>
          <td>180</td>
        </tr>

        <tr>
          <td>4</td>
          <td><span class="bola verde"></span>Ana Costa</td>
          <td>160</td>
        </tr>

        <tr>
          <td>5</td>
          <td><span class="bola vermelho"></span>Pedro Rocha</td>
          <td>120</td>
        </tr>

      </tbody>
    </table>

  </div>
</div>

<script>

// 📅 CONTADOR DE DIAS
function atualizarContador(){
  const hoje = new Date();
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  const diasRestantes = ultimoDia.getDate() - hoje.getDate();

  document.getElementById("contador").innerText =
    `Dias restantes no mês: ${diasRestantes}`;
}

// 🔍 BUSCA
document.getElementById("busca").addEventListener("input", function(){
  const filtro = this.value.toLowerCase();
  const linhas = document.querySelectorAll("#tabela tr");

  linhas.forEach(linha => {
    const nome = linha.children[1].innerText.toLowerCase();
    linha.style.display = nome.includes(filtro) ? "" : "none";
  });
});

// 🚀 INICIAR
atualizarContador();

</script>

</body>
</html>
