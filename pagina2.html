<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ranking de Técnicos</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #1f2937, #111827);
  margin:0;
  color:white;
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  padding:30px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.header h1{
  font-size:26px;
}

.voltar{
  text-decoration:none;
  color:#9ca3af;
}

/* CARD */
.card{
  background:#1f2937;
  padding:20px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

#contador{
  color:#9ca3af;
}

input{
  background:#111827;
  border:1px solid #374151;
  color:white;
  padding:8px;
  border-radius:6px;
}

/* TABELA */
table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  padding:12px;
  background:#111827;
  color:#9ca3af;
}

td{
  padding:12px;
  border-bottom:1px solid #374151;
}

tr:hover{
  background:#111827;
}

/* DESTAQUE */
.top{
  background:#064e3b !important;
}

/* BOLAS */
.bola{
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
}

.ouro{background:#fbbf24;}
.prata{background:#9ca3af;}
.bronze{background:#d97706;}

.verde{background:#22c55e;}
.amarelo{background:#f59e0b;}
.vermelho{background:#ef4444;}

</style>

</head>

<body>

<div class="container">

  <div class="header">
    <h1>🏆 Ranking de Técnicos</h1>
    <a href="index.html" class="voltar">← Voltar</a>
  </div>

  <div class="card">

    <div class="top-bar">
      <div id="contador"></div>
      <input type="text" id="busca" placeholder="Buscar técnico...">
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Técnico</th>
          <th>Pontos</th>
        </tr>
      </thead>

      <tbody id="tabela">

        <!-- EXEMPLO -->
        <tr class="top">
          <td>1</td>
          <td><span class="bola ouro"></span>João Silva</td>
          <td>250</td>
        </tr>

        <tr class="top">
          <td>2</td>
          <td><span class="bola prata"></span>Maria Souza</td>
          <td>210</td>
        </tr>

        <tr class="top">
          <td>3</td>
          <td><span class="bola bronze"></span>Carlos Lima</td>
          <td>180</td>
        </tr>

        <tr>
          <td>4</td>
          <td><span class="bola verde"></span>Ana Costa</td>
          <td>160</td>
        </tr>

        <tr>
          <td>5</td>
          <td><span class="bola vermelho"></span>Pedro Rocha</td>
          <td>120</td>
        </tr>

      </tbody>
    </table>

  </div>

</div>

<script>

// CONTADOR
function atualizarContador(){
  const hoje = new Date();
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  const diasRestantes = ultimoDia.getDate() - hoje.getDate();

  document.getElementById("contador").innerText =
    `Dias restantes: ${diasRestantes}`;
}

// BUSCA
document.getElementById("busca").addEventListener("input", function(){
  const filtro = this.value.toLowerCase();
  const linhas = document.querySelectorAll("#tabela tr");

  linhas.forEach(linha => {
    const nome = linha.children[1].innerText.toLowerCase();
    linha.style.display = nome.includes(filtro) ? "" : "none";
  });
});

atualizarContador();

</script>

</body>
</html>
