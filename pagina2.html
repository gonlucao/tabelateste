<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ranking de Técnicos</title>

<style>
body{
  font-family: Arial;
  background:#f5f7fa;
  padding:20px;
}

.container{
  max-width:800px;
  margin:auto;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
}

.top-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

#contador{
  font-weight:bold;
}

input{
  padding:8px;
  width:200px;
  border-radius:6px;
  border:1px solid #ccc;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th, td{
  padding:12px;
  text-align:left;
}

th{
  background:#2196F3;
  color:white;
}

tr:nth-child(even){
  background:#f2f2f2;
}

.top{
  background:#ffeaa7 !important;
  font-weight:bold;
}

.bola{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
}

.verde{ background:green; }
.amarelo{ background:orange; }
.vermelho{ background:red; }
.ouro{ background:gold; }
.prata{ background:silver; }
.bronze{ background:#cd7f32; }

.link{
  display:inline-block;
  margin-bottom:10px;
  text-decoration:none;
  color:#2196F3;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="container">
  <div class="card">

    <a href="tecnicos.html" class="link">← Voltar para técnicos</a>

    <h1>🏆 Ranking de Técnicos</h1>

    <div class="top-info">
      <div id="contador"></div>
      <input type="text" id="busca" placeholder="Buscar técnico...">
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Técnico</th>
          <th>Pontos</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>

  </div>
</div>

<!-- Script central -->
<script src="script.js"></script>

<script>

// 📅 CONTADOR DE DIAS RESTANTES
function atualizarContador(){
  const hoje = new Date();
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  const diasRestantes = ultimoDia.getDate() - hoje.getDate();

  document.getElementById("contador").innerText =
    `Dias restantes no mês: ${diasRestantes}`;
}

// 🔍 BUSCA EM TEMPO REAL
document.getElementById("busca").addEventListener("input", function(){
  const filtro = this.value.toLowerCase();
  const linhas = document.querySelectorAll("#tabela tr");

  linhas.forEach(linha => {
    const nome = linha.children[1].innerText.toLowerCase();
    linha.style.display = nome.includes(filtro) ? "" : "none";
  });
});

async function carregarRanking(){

  const dados = await buscarDados();
  const ranking = calcularPontuacao(dados);

  const tabela = document.getElementById("tabela");

  ranking.forEach(([nome, pontos], index) => {

    let corMeta = "vermelho";

    if(pontos >= 200) corMeta = "verde";
    else if(pontos >= 150) corMeta = "amarelo";

    let corPosicao = "";
    if(index === 0) corPosicao = "ouro";
    else if(index === 1) corPosicao = "prata";
    else if(index === 2) corPosicao = "bronze";

    tabela.innerHTML += `
      <tr class="${index < 3 ? 'top' : ''}">
        <td>${index + 1}</td>
        <td>
          <span class="bola ${corPosicao || corMeta}"></span>
          ${nome}
        </td>
        <td>${pontos}</td>
      </tr>
    `;
  });

}

// 🚀 INICIALIZAÇÃO
atualizarContador();
carregarRanking();

</script>

</body>
</html>
