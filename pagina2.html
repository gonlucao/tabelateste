<div class="logo">
    Campeonato de Instalações
</div>

<nav class="menu">
    <a href="index.html">Dashboard</a>

<div class="page-title">
    <h1>Ranking Geral</h1>
    <p>Acompanhe sua posição no campeonato.</p>
</div>

<div class="cards">

    <div class="card">
        <h3>Participantes</h3>
        <div class="value" id="participantes">0</div>
    </div>

    <div class="card">
        <h3>Média Geral</h3>
        <div class="value" id="media">0</div>
    </div>

    <div class="card">
        <h3>Maior Pontuação</h3>
        <div class="value" id="maiorPontuacao">0</div>
    </div>

    <div class="card">
        <h3>Meta Atual</h3>
        <div class="value">170</div>
    </div>

</div>

<div class="table-container">

    <input
        type="text"
        id="pesquisa"
        class="search"
        placeholder="Pesquisar técnico..."
    >

    <table>

        <thead>
            <tr>
                <th>Posição</th>
                <th>Técnico</th>
                <th>Pontos</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="rankingBody">
        </tbody>

    </table>

    <div class="legenda">
        <span>🏆 Acima de 250</span>
        <span>🟢 Meta Atingida</span>
        <span>🟡 Próximo da Meta</span>
        <span>🔴 Abaixo da Meta</span>
    </div>

</div>
