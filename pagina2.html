<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ranking Mensal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter';
  background:#f5f7fb;
  padding:20px;
}

.container { max-width:1200px; margin:auto; }

/* MENU */
.menu { display:flex; gap:10px; margin-bottom:15px; }

.menu button{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#e5e7eb;
  font-weight:600;
}

.menu button.ativo{
  background:#dc2626;
  color:white;
}

/* TOPO */
.topbar {
  background: linear-gradient(90deg,#b91c1c,#dc2626);
  padding:15px;
  border-radius:12px;
  color:white;
  margin-bottom:20px;
}

/* TOP 3 */
.top3 {
  display:flex;
  gap:15px;
  margin-bottom:20px;
}

.top3-card {
  flex:1;
  background:white;
  padding:20px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 4px 10px #0001;
}

.top3-card .medalha {
  font-size:26px;
}

.top3-card strong {
  display:block;
  margin-top:8px;
  font-size:16px;
}

/* CARD */
.card {
  background:white;
  padding:20px;
  border-radius:16px;
}

/* TABELA */
table {
  width:100%;
  border-collapse:collapse;
}

th,td {
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th:first-child, td:first-child {
  text-align:left;
}

/* BOLINHAS */
.status {
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:8px;
}

.verde { background:#16a34a; }
.amarelo { background:#f59e0b; }
.vermelho { background:#dc2626; }

</style>
</head>

<body>

<div class="container">

<!-- MENU -->
<div class="menu">
  <button onclick="window.location.href='index.html'">📊 Dashboard</button>
  <button class="ativo">🏆 Ranking Mensal</button>
</div>

<!-- 🔥 TÍTULO DINÂMICO -->
<div class="topbar">
  <h2 id="tituloMes"></h2>
</div>

<!-- TOP 3 -->
<div class="top3" id="top3"></div>

<div class="card">
<table>
<thead>
<tr>
<th>#</th>
<th>Técnico</th>
<th>Pontuação</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>

/* GIDs */
const abas = [
  "1836732217",
  "576248296",
  "1758926410"
];

/* NOME DO MÊS */
function getNomeMes(){
  const meses = [
    "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
    "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
  ];
  return meses[new Date().getMonth()];
}

/* PEGAR MÊS ATUAL */
function getMesAtual(){
  const mes = new Date().getMonth();
  return Math.min(mes, abas.length - 1);
}

async function carregarMes(gid){
  const url = `https://docs.google.com/spreadsheets/d/1KAmeD9jbBX8JssWWeWG3kR03J4zVEjQDx--ojQIFSmg/gviz/tq?tqx=out:json&gid=${gid}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}")+1));
  return json.table.rows;
}

async function carregarRanking(){

  // 🔥 ATUALIZA TÍTULO
  document.getElementById("tituloMes").innerText =
    "Ranking do mês de " + getNomeMes();

  const mesIndex = getMesAtual();
  const rows = await carregarMes(abas[mesIndex]);

  let lista = [];

  rows.forEach((r,index)=>{
    if(index===0) return;

    let nome = r.c[0]?.v;
    if(!nome) return;

    let total = Number(r.c[19]?.v)||0;

    lista.push({nome, total});
  });

  lista.sort((a,b)=>b.total-a.total);

  renderTop3(lista);
  renderTabela(lista);
}

/* TOP 3 */
function renderTop3(lista){
  let top3 = document.getElementById("top3");
  top3.innerHTML = "";

  const medalhas = ["🥇","🥈","🥉"];

  lista.slice(0,3).forEach((t,i)=>{
    top3.innerHTML += `
      <div class="top3-card">
        <div class="medalha">${medalhas[i]}</div>
        <strong>${t.nome}</strong>
        <div>${t.total}</div>
      </div>
    `;
  });
}

/* TABELA */
function renderTabela(lista){
  let tbody = document.getElementById("tbody");
  tbody.innerHTML="";

  lista.forEach((t,i)=>{

    let classe = "vermelho";

    if(i < 3){
      classe = "verde";
    } else if(t.total >= 170){
      classe = "amarelo";
    }

    tbody.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td>
          <span class="status ${classe}"></span>
          ${t.nome}
        </td>
        <td>${t.total}</td>
      </tr>
    `;
  });
}

carregarRanking();

</script>

</body>
</html>
