<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ranking de Técnicos</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
}

.container{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:10px;
}

#contador{
  font-weight:bold;
  color:#333;
}

input{
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  width:220px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#007bff;
  color:white;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #eee;
}

tr:hover{
  background:#f1f1f1;
}

.top{
  background:#fff3cd;
  font-weight:bold;
}

.bola{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
}

/* CORES */
.ouro{background:gold;}
.prata{background:silver;}
.bronze{background:#cd7f32;}
.verde{background:green;}
.amarelo{background:orange;}
.vermelho{background:red;}

.link{
  display:inline-block;
  margin-bottom:15px;
  text-decoration:none;
  color:#007bff;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="container">
  <div class="card">

    <a href="tecnicos.html" class="link">← Voltar</a>

    <h1>🏆 Ranking de Técnicos</h1>

    <div class="top-bar">
      <div id="contador"></div>
      <input type="text" id="busca" placeholder="Buscar técnico...">
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Técnico</th>
          <th>Pontos</th>
        </tr>
      </thead>

      <tbody id="tabela">

        <!-- EXEMPLO -->
        <tr class="top">
          <td>1</td>
          <td><span class="bola ouro"></span>João Silva</td>
          <td>250</td>
        </tr>

        <tr class="top">
          <td>2</td>
          <td><span class="bola prata"></span>Maria Souza</td>
          <td>210</td>
        </tr>

        <tr class="top">
          <td>3</td>
          <td><span class="bola bronze"></span>Carlos Lima</td>
          <td>180</td>
        </tr>

        <tr>
          <td>4</td>
          <td><span class="bola verde"></span>Ana Costa</td>
          <td>160</td>
        </tr>

        <tr>
          <td>5</td>
          <td><span class="bola vermelho"></span>Pedro Rocha</td>
          <td>120</td>
        </tr>

      </tbody>
    </table>

  </div>
</div>

<script>

// 📅 CONTADOR DE DIAS
function atualizarContador(){
  const hoje = new Date();
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  const diasRestantes = ultimoDia.getDate() - hoje.getDate();

  document.getElementById("contador").innerText =
    `Dias restantes no mês: ${diasRestantes}`;
}

// 🔍 BUSCA
document.getElementById("busca").addEventListener("input", function(){
  const filtro = this.value.toLowerCase();
  const linhas = document.querySelectorAll("#tabela tr");

  linhas.forEach(linha => {
    const nome = linha.children[1].innerText.toLowerCase();
    linha.style.display = nome.includes(filtro) ? "" : "none";
  });
});

// 🚀 INICIAR
atualizarContador();

</script>

</body>
</html>
