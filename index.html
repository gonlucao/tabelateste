<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indicadores Equipes Externas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#eef2f7;
    padding:20px;
    color:#1f2937;
}

/* ==========================
   CABEÇALHO
========================== */

.hero{
    background:linear-gradient(135deg,#d90429,#ef233c);
    color:white;
    border-radius:20px;
    padding:35px 45px;
    margin-bottom:25px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;

    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.hero-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    width:90px;
    height:90px;
    background:white;
    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:10px;
    overflow:hidden;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.hero h1{
    font-size:38px;
    font-weight:700;
    margin-bottom:8px;
}

.hero p{
    font-size:15px;
    opacity:.9;
}

.hero-info{
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);

    border-radius:18px;
    padding:20px 35px;
    text-align:center;
}

.hero-info span{
    display:block;
    font-size:14px;
}

.hero-info strong{
    font-size:42px;
}

/* ==========================
   TOP 3
========================== */

.ranking-card{
    background:white;
    border-radius:20px;
    padding:30px;
    margin-bottom:25px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.ranking-header{
    text-align:center;
    font-size:24px;
    font-weight:700;
    margin-bottom:35px;
}

.top3-container{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:25px;
    flex-wrap:wrap;
}

.top3-item{
    flex:1;
    min-width:250px;

    background:#f8fafc;
    border-radius:18px;
    padding:25px;

    text-align:center;
}

.top3-item.ouro{
    border-top:6px solid gold;
    transform:scale(1.05);
}

.top3-item.prata{
    border-top:6px solid silver;
}

.top3-item.bronze{
    border-top:6px solid #cd7f32;
}

.medal{
    font-size:42px;
    margin-bottom:10px;
}

.nome{
    font-size:18px;
    font-weight:700;
}

.cidade{
    color:#64748b;
    margin-top:5px;
}

.pontos{
    margin-top:15px;
    font-size:42px;
    font-weight:700;
    color:#d90429;
}

/* ==========================
   INDICADORES
========================== */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;

    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card-title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    margin-bottom:25px;
}

.card-value{
    text-align:center;
    font-size:56px;
    font-weight:700;
}

.consistencia{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.meta-box{
    width:100px;
    height:100px;

    border-radius:15px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    font-weight:700;
}

.verde{
    background:#16a34a;
}

.amarelo{
    background:#f59e0b;
}

.vermelho{
    background:#ef4444;
}

.percentual{
    font-size:28px;
}

.meta{
    font-size:20px;
}

/* ==========================
   TABELA
========================== */

.table-card{
    background:white;
    border-radius:20px;
    padding:25px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.table-header{
    font-size:24px;
    font-weight:700;
}

.table-subtitle{
    color:#64748b;
    margin:8px 0 20px;
}

.table-responsive{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1400px;
}

thead{
    background:#d90429;
    color:white;
}

th{
    padding:15px;
    text-align:center;
}

td{
    padding:14px;
    text-align:center;
    border-bottom:1px solid #e5e7eb;
}

th:first-child,
td:first-child{
    text-align:left;
    font-weight:600;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

tbody tr:hover{
    background:#edf2f7;
}

.media{
    color:#d90429;
    font-weight:700;
}

.status{
    font-size:18px;
}

/* ==========================
   MOBILE
========================== */

@media(max-width:768px){

    body{
        padding:15px;
    }

    .hero{
        flex-direction:column;
        align-items:flex-start;
        padding:25px;
    }

    .hero h1{
        font-size:26px;
    }

    .hero-info{
        width:100%;
    }

    .top3-container{
        flex-direction:column;
    }

    .top3-item{
        width:100%;
        min-width:100%;
    }

    .top3-item.ouro{
        transform:none;
    }

}

</style>

</head>
