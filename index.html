<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Página</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#0066cc;
    color:white;
    padding:20px;
    text-align:center;
}

main{
    max-width:1000px;
    margin:20px auto;
    padding:20px;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
    <h1>Bem-vindo</h1>
</header>

<main>
    <h2>Minha Página HTML</h2>
    <p>Página criada em HTML, CSS e JavaScript.</p>

    <button onclick="mostrarMensagem()">
        Clique Aqui
    </button>
</main>

<script>
function mostrarMensagem(){
    alert("Olá, Lucas!");
}
</script>

</body>
</html>
