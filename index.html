<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Monitoramento - Metas equipes externa</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter';
  background:#f5f7fb;
  padding:20px;
}

/* 🔽 (TODO SEU CSS ORIGINAL MANTIDO) */
.login-overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:#00000090;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.login-box{
  background:white;
  padding:35px;
  border-radius:12px;
  width:300px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.login-box input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.login-box button{
  margin-top:10px;
  width:100%;
  padding:10px;
  background:#dc2626;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.container { max-width:1200px; margin:auto; }

/* 🔽 EXPANSÃO */
.expand-icon{
  cursor:pointer;
  margin-right:6px;
  transition:0.3s;
}

.expand-icon.rotacionada{
  transform:rotate(90deg);
}

.linha-expandida{
  display:none;
  background:#f9fafb;
}

.box-expandida{
  padding:15px;
}

.grid-expandida{
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:10px;
}

.item-box{
  background:white;
  border-radius:10px;
  padding:12px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
</style>
</head>

<body>

<div class="login-overlay" id="loginBox">
  <div class="login-box">
    <h3>Login</h3>
    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <p id="erro" style="color:red;font-size:12px;"></p>
  </div>
</div>

<div class="container">

<div class="user-bar">
  <span id="usuarioLogado"></span>
  <button onclick="logout()">Sair</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Técnico</th>
<th>Jan</th>
<th>Fev</th>
<th>Mar</th>
<th>Média</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbydC82xbEs7KD4MZcwxyxXX6ahBJKWN9QYKqZ_DV_OZH96EsG1JyyomJNjd3GpwWe2N/exec";

let dadosTecnicos = {};
let lista = [];
let assiduidadeDB = {};

/* LOGIN ORIGINAL */
window.onload = () => {
  let logado = JSON.parse(localStorage.getItem("logado"));

  if(logado){
    aplicarLogin(logado);
  }
};

async function login(){
  let res = await fetch(`${API_URL}?user=${user.value}&pass=${pass.value}`);
  let data = await res.json();

  if(data.status){
    let userData = {nome:data.nome, perfil:data.perfil};
    localStorage.setItem("logado", JSON.stringify(userData));
    aplicarLogin(userData);
  } else {
    erro("Login inválido");
  }
}

function aplicarLogin(user){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("usuarioLogado").innerText = `👤 ${user.nome} (${user.perfil})`;

  carregarDados();
}

function logout(){
  localStorage.removeItem("logado");
  location.reload();
}

function erro(msg){
  document.getElementById("erro").innerText = msg;
}

/* 🔥 ASSIDUIDADE (NÃO INTERFERE MAIS NO LOGIN) */
async function carregarAssiduidade(){
  try{
    const url = `https://docs.google.com/spreadsheets/d/1KAmeD9jbBX8JssWWeWG3kR03J4zVEjQDx--ojQIFSmg/gviz/tq?tqx=out:json&gid=1593374917`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}")+1));

    json.table.rows.forEach((r,i)=>{
      if(i===0) return;

      let nome = r.c[0]?.v;
      let perc = r.c[6]?.v;

      if(nome) assiduidadeDB[nome] = perc;
    });

  }catch(e){
    console.error("Erro assiduidade", e);
  }
}

/* DADOS */
async function carregarDados(){

  await carregarAssiduidade(); // 🔥 AQUI É O LUGAR CERTO

  dadosTecnicos = {
    "Cristian Klein":[289,151,245],
    "Daniel Correa":[271,157,0]
  };

  montarLista();
  render();
}

function media(a){ return a.reduce((x,y)=>x+y,0)/a.length; }

function montarLista(){
  lista = Object.keys(dadosTecnicos).map(n=>{
    let v = dadosTecnicos[n];
    return {n,v,m:media(v)};
  });
}

function render(){
  renderTabela();
}

function renderTabela(){
  let tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  lista.forEach((o,index)=>{
    let id="exp_"+index;
    let ass = assiduidadeDB[o.n] || "--";

    let linha=`
    <tr>
      <td><span class="expand-icon" onclick="toggleExpand('${id}',this)">▶</span>${o.n}</td>
      <td>${o.v[0]}</td>
      <td>${o.v[1]}</td>
      <td>${o.v[2]}</td>
      <td>${o.m.toFixed(1)}</td>
      <td>OK</td>
    </tr>

    <tr id="${id}" class="linha-expandida">
      <td colspan="6">
        <div class="box-expandida">
          <div class="grid-expandida">

            <div class="item-box">
              <strong>Meta</strong>
              <span>${o.m.toFixed(1)}</span>
            </div>

            <div class="item-box">
              <strong>Assiduidade</strong>
              <span>${ass}%</span>
            </div>

            <div class="item-box">
              <strong>Danos</strong>
              <span>--</span>
            </div>

            <div class="item-box">
              <strong>Comportamento</strong>
              <span>--</span>
            </div>

          </div>
        </div>
      </td>
    </tr>
    `;

    tbody.innerHTML+=linha;
  });
}

function toggleExpand(id,el){
  let l=document.getElementById(id);
  if(l.style.display==="table-row"){
    l.style.display="none";
    el.classList.remove("rotacionada");
  }else{
    l.style.display="table-row";
    el.classList.add("rotacionada");
  }
}

</script>

</body>
</html>
