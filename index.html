<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indicadores Equipes Externas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#eef2f7;
    padding:20px;
}

/* ==========================
   CABEÇALHO
========================== */

.hero{
    background:linear-gradient(135deg,#d90429,#ef233c);
    color:white;
    border-radius:20px;
    padding:30px 40px;
    margin-bottom:25px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;

    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.hero-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    width:75px;
    height:75px;
    background:white;
    color:#d90429;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;
    font-weight:bold;
    font-size:24px;
}

.hero h1{
    font-size:34px;
    margin-bottom:5px;
}

.hero p{
    opacity:.9;
}

.hero-info{
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);

    padding:20px 35px;
    border-radius:18px;
    text-align:center;
}

.hero-info span{
    display:block;
    font-size:14px;
    margin-bottom:5px;
}

.hero-info strong{
    font-size:42px;
}

/* ==========================
   TOP 3
========================== */

.section-title{
    font-size:22px;
    font-weight:700;
    margin-bottom:15px;
    color:#1f2937;
}

.top3-container{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:20px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.top3-card{
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    min-width:260px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.top3-card.ouro{
    min-height:220px;
    border-top:6px solid #FFD700;
}

.top3-card.prata{
    min-height:190px;
    border-top:6px solid #C0C0C0;
}

.top3-card.bronze{
    min-height:190px;
    border-top:6px solid #CD7F32;
}

.medal{
    font-size:42px;
    margin-bottom:10px;
}

.nome{
    font-size:20px;
    font-weight:700;
}

.cidade{
    color:#666;
    margin-top:5px;
}

.pontos{
    font-size:42px;
    font-weight:700;
    margin-top:15px;
    color:#d90429;
}

/* ==========================
   CARDS
========================== */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:35px;
    min-height:220px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card-title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    margin-bottom:35px;
}

.card-value{
    text-align:center;
    font-size:58px;
    font-weight:700;
}

/* ==========================
   CONSISTÊNCIA
========================== */

.consistencia{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.meta-box{
    width:110px;
    height:110px;
    border-radius:15px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    font-weight:700;
}

.verde{
    background:#16a34a;
}

.amarelo{
    background:#f59e0b;
}

.vermelho{
    background:#ef4444;
}

.percentual{
    font-size:32px;
}

.meta{
    font-size:24px;
}

/* ==========================
   MOBILE
========================== */

@media(max-width:768px){

body{
    padding:15px;
}

.hero{
    flex-direction:column;
    align-items:flex-start;
    padding:20px;
}

.hero h1{
    font-size:24px;
}

.hero-info{
    width:100%;
}

.hero-info strong{
    font-size:34px;
}

.cards{
    grid-template-columns:1fr;
}

.top3-container{
    flex-direction:column;
    align-items:stretch;
}

.top3-card{
    min-width:100%;
}

.card{
    padding:25px;
}

.card-value{
    font-size:42px;
}

.meta-box{
    width:90px;
    height:90px;
}

.percentual{
    font-size:24px;
}

.meta{
    font-size:18px;
}

}

</style>
</head>
<body>

<!-- CABEÇALHO -->

<div class="hero">

    <div class="hero-left">

        <div class="logo">
            RBT
        </div>

        <div>
            <h1>Indicadores Equipes Externas</h1>
            <p>Acompanhamento de desempenho, produtividade e metas das equipes.</p>
        </div>

    </div>

    <div class="hero-info">
        <span>Total de Técnicos</span>
        <strong>61</strong>
    </div>

</div>

<!-- TOP 3 -->

<div class="section-title">
🏆 Ranking Geral - Top 3
</div>

<div class="top3-container">

    <div class="top3-card prata">
        <div class="medal">🥈</div>
        <div class="nome">Cristian Klein</div>
        <div class="cidade">Nova Petrópolis</div>
        <div class="pontos">289</div>
    </div>

    <div class="top3-card ouro">
        <div class="medal">🥇</div>
        <div class="nome">Lucas Rinker</div>
        <div class="cidade">OFF</div>
        <div class="pontos">294</div>
    </div>

    <div class="top3-card bronze">
        <div class="medal">🥉</div>
        <div class="nome">Daniel Correa</div>
        <div class="cidade">Gramado</div>
        <div class="pontos">271</div>
    </div>

</div>

<!-- INDICADORES -->

<div class="cards">

    <div class="card">
        <div class="card-title">
            Média Geral
        </div>

        <div class="card-value">
            166.5
        </div>
    </div>

    <div class="card">

        <div class="card-title">
            Consistência de Metas
        </div>

        <div class="consistencia">

            <div class="meta-box verde">
                <div class="percentual">54%</div>
                <div class="meta">3/3</div>
            </div>

            <div class="meta-box amarelo">
                <div class="percentual">0%</div>
                <div class="meta">2/3</div>
            </div>

            <div class="meta-box vermelho">
                <div class="percentual">0%</div>
                <div class="meta">1/3</div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
