<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Monitoramento - Metas equipes externa</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter';
  background:#f5f7fb;
  padding:20px;
}

/* LOGIN */
.login-overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:#00000090;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.login-box{
  background:white;
  padding:35px;
  border-radius:12px;
  width:300px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.login-box input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.login-box button{
  margin-top:10px;
  width:100%;
  padding:10px;
  background:#dc2626;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* USER BAR */
.user-bar{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-bottom:10px;
}

.user-bar button{
  background:#dc2626;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.container { max-width:1200px; margin:auto; }

/* MENU */
.menu {
  display: flex;
  gap: 12px;
  margin-bottom: 15px;
}

.menu button {
  padding: 10px 18px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: #f3f4f6;
  font-weight: 600;
  transition: 0.2s;
}

.menu button:hover {
  background: #e5e7eb;
}

.menu button.ativo {
  background: #dc2626;
  color: white;
}

/* PAGINAS */
.pagina { display:none; }
.pagina.ativa { display:block; }

.topbar {
  background: linear-gradient(90deg,#b91c1c,#dc2626);
  padding:15px;
  border-radius:12px;
  color:white;
}

.topbar-content {
  display:flex;
  align-items:center;
  gap:12px;
}

.logo { height:45px; }

/* TABLE */
.card {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
}

table { width:100%; border-collapse:collapse; }

th,td {
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

.meta-ok{color:#16a34a;font-weight:bold;}
.meta-bad{color:#dc2626;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginBox">
  <div class="login-box">
    <h3>Login</h3>
    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <p id="erro" style="color:red;font-size:12px;"></p>
  </div>
</div>

<div class="container">

<div class="user-bar">
  <span id="usuarioLogado"></span>
  <button onclick="logout()">Sair</button>
</div>

<!-- MENU -->
<div class="menu" id="menu">
  <button class="ativo" onclick="trocarPagina(0)">📊 Dashboard</button>
  <button onclick="window.location.href='pagina2.html'">🏆 Metas equipes</button>
</div>

<!-- DASHBOARD -->
<div class="pagina ativa" id="p1">

<div class="topbar">
  <div class="topbar-content">
    <img src="https://i.ibb.co/rjpBZ8P/Logo-RBT-Perfil.jpg" class="logo">
    <span>Monitoramento - Metas equipes externa</span>
  </div>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Técnico</th>
<th>Jan</th>
<th>Fev</th>
<th>Mar</th>
<th>Média</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

</div>

<script>

/* API */
const API_URL = "https://script.google.com/macros/s/AKfycbydC82xbEs7KD4MZcwxyxXX6ahBJKWN9QYKqZ_DV_OZH96EsG1JyyomJNjd3GpwWe2N/exec";

/* LOGIN */
window.onload = () => {
  let logado = JSON.parse(localStorage.getItem("logado"));
  if(logado){
    aplicarLogin(logado);
  }
};

async function login(){
  let u = user.value;
  let p = pass.value;

  let res = await fetch(`${API_URL}?user=${u}&pass=${p}`);
  let data = await res.json();

  if(data.status){
    let userData = {nome:data.nome, perfil:data.perfil};
    localStorage.setItem("logado", JSON.stringify(userData));
    aplicarLogin(userData);
  }else{
    erro("Login inválido");
  }
}

function aplicarLogin(user){
  loginBox.style.display="none";
  usuarioLogado.innerText = `👤 ${user.nome}`;
  carregarDados();
}

function logout(){
  localStorage.removeItem("logado");
  location.reload();
}

function erro(msg){
  document.getElementById("erro").innerText = msg;
}

/* MENU */
function trocarPagina(i){
  document.querySelectorAll(".pagina").forEach((p,index)=>{
    p.classList.toggle("ativa", index===i);
  });

  document.querySelectorAll("#menu button").forEach((b,index)=>{
    b.classList.toggle("ativo", index===i);
  });
}

/* DADOS PLANILHA */
const abas = ["1836732217","576248296","1758926410"];

async function carregarMes(gid){
  const url = `https://docs.google.com/spreadsheets/d/1KAmeD9jbBX8JssWWeWG3kR03J4zVEjQDx--ojQIFSmg/gviz/tq?tqx=out:json&gid=${gid}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}")+1));
  return json.table.rows;
}

async function carregarDados(){
  let dados = {};
  const resultados = await Promise.all(abas.map(gid => carregarMes(gid)));

  resultados.forEach((rows, i) => {
    rows.forEach((r,index)=>{
      if(index===0) return;
      let nome = r.c[0]?.v;
      if(!nome) return;
      let total = Number(r.c[19]?.v)||0;

      if(!dados[nome]) dados[nome]=[0,0,0];
      dados[nome][i]=total;
    });
  });

  let tbody = document.getElementById("tbody");
  tbody.innerHTML="";

  Object.keys(dados).forEach(n=>{
    let v = dados[n];
    let media = (v[0]+v[1]+v[2])/3;

    tbody.innerHTML += `
      <tr>
        <td>${n}</td>
        <td>${v[0]}</td>
        <td>${v[1]}</td>
        <td>${v[2]}</td>
        <td>${media.toFixed(1)}</td>
      </tr>
    `;
  });
}

</script>

</body>
</html>
