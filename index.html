<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Metas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#e5e7eb;
    padding:20px;
}

/* GRID DOS CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

/* CARD PADRÃO */

.card{
    background:#fff;
    border-radius:15px;
    padding:30px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    min-height:210px;
}

/* TITULO */

.card-title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    margin-bottom:30px;
}

/* VALOR PRINCIPAL */

.card-value{
    text-align:center;
    font-size:56px;
    font-weight:700;
}

/* CONSISTENCIA */

.consistencia{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:20px;
}

.meta-box{
    width:110px;
    height:110px;
    border-radius:15px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.meta-box .percentual{
    font-size:34px;
}

.meta-box .texto{
    font-size:24px;
}

.verde{
    background:#16a34a;
}

.amarelo{
    background:#f59e0b;
}

.vermelho{
    background:#ef2222;
}

/* PODIUM */

.podium{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:20px;
}

.podium-card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.medalha{
    font-size:28px;
    margin-bottom:10px;
}

.nome{
    font-size:16px;
    font-weight:700;
    margin-bottom:8px;
}

.pontos{
    font-size:32px;
    font-weight:700;
}

</style>
</head>
<body>

<!-- PRIMEIRA LINHA -->

<div class="cards">

    <div class="card">
        <div class="card-title">
            Total Técnicos
        </div>

        <div class="card-value">
            61
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            Média Geral
        </div>

        <div class="card-value">
            166.5
        </div>
    </div>

    <div class="card">

        <div class="card-title">
            Consistência de Metas
        </div>

        <div class="consistencia">

            <div class="meta-box verde">
                <div class="percentual">54%</div>
                <div class="texto">3/3</div>
            </div>

            <div class="meta-box amarelo">
                <div class="percentual">0%</div>
                <div class="texto">2/3</div>
            </div>

            <div class="meta-box vermelho">
                <div class="percentual">0%</div>
                <div class="texto">1/3</div>
            </div>

        </div>

    </div>

</div>

<!-- SEGUNDA LINHA -->

<div class="podium">

    <div class="podium-card">
        <div class="medalha">🥇</div>
        <div class="nome">Lucas Rinker (OFF)</div>
        <div class="pontos">294</div>
    </div>

    <div class="podium-card">
        <div class="medalha">🥈</div>
        <div class="nome">Cristian Klein (Nova Petrópolis)</div>
        <div class="pontos">289</div>
    </div>

    <div class="podium-card">
        <div class="medalha">🥉</div>
        <div class="nome">Daniel Correa (Gramado)</div>
        <div class="pontos">271</div>
    </div>

</div>

</body>
</html>
