<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indicadores Equipes Externas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#eef2f7;
    padding:20px;
    color:#1f2937;
}

/* =========================
   CABEÇALHO
========================= */

.hero{
    background:linear-gradient(135deg,#d90429,#ef233c);
    color:white;
    border-radius:24px;
    padding:25px 35px;
    margin-bottom:30px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;

    gap:20px;

    box-shadow:0 12px 30px rgba(0,0,0,.15);
}

.hero-left{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
}

.logo{
    width:90px;
    height:90px;

    background:white;
    border-radius:20px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.hero h1{
    font-size:36px;
    margin-bottom:5px;
}

.hero p{
    font-size:14px;
    opacity:.9;
}

.hero-info{
    background:rgba(255,255,255,.15);
    padding:18px 30px;
    border-radius:18px;
    text-align:center;
}

.hero-info strong{
    display:block;
    font-size:42px;
}

/* =========================
   TOP 3
========================= */

.ranking-card{
    background:white;
    border-radius:20px;
    padding:30px;
    margin-top:15px;
    margin-bottom:25px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.ranking-header{
    text-align:center;
    font-size:24px;
    font-weight:700;
    margin-bottom:30px;
}

.top3-container{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:20px;
    flex-wrap:wrap;
}

.top3-item{
    flex:1;
    min-width:220px;

    background:#f8fafc;
    border-radius:18px;

    padding:25px;

    text-align:center;

    transition:.3s;
}

.top3-item:hover{
    transform:translateY(-5px);
}

.ouro{
    border-top:6px solid gold;
}

.prata{
    border-top:6px solid silver;
}

.bronze{
    border-top:6px solid #cd7f32;
}

.medal{
    font-size:40px;
    margin-bottom:10px;
}

.nome{
    font-weight:700;
}

.pontos{
    margin-top:10px;
    font-size:42px;
    font-weight:700;
    color:#d90429;
}

/* =========================
   INDICADORES
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);

    transition:.3s;
}

.card:hover{
    transform:translateY(-4px);
}

.card-title{
    text-align:center;
    font-weight:700;
    margin-bottom:20px;
}

.card-value{
    text-align:center;
    font-size:54px;
    font-weight:700;
}

/* =========================
   CONSISTÊNCIA
========================= */

.consistencia{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.meta-box{
    width:100px;
    height:100px;

    border-radius:15px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    font-weight:700;
}

.verde{
    background:#16a34a;
}

.amarelo{
    background:#f59e0b;
}

.vermelho{
    background:#ef4444;
}

/* =========================
   TABELA
========================= */

.table-card{
    background:white;
    border-radius:20px;
    padding:25px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.table-header{
    font-size:24px;
    font-weight:700;
}

.table-subtitle{
    color:#64748b;
    margin:8px 0 20px;
}

.table-responsive{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1400px;
    border-collapse:collapse;
}

thead{
    background:#d90429;
    color:white;
}

th{
    padding:14px;
}

td{
    padding:14px;
    border-bottom:1px solid #e5e7eb;
}

th:first-child,
td:first-child{
    text-align:left;
    font-weight:600;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

tbody tr:hover{
    background:#edf2f7;
}

.media{
    color:#d90429;
    font-weight:700;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    body{
        padding:15px;
    }

    .hero{
        flex-direction:column;
        align-items:flex-start;
    }

    .hero-info{
        width:100%;
    }

    .top3-container{
        flex-direction:column;
    }

    .top3-item{
        width:100%;
    }

}

</style>
</head>

<!-- CABEÇALHO -->

<div class="hero">

    <div class="hero-left">

        <div class="logo">
            <img src="https://i.ibb.co/dwpdCjFz/Logo-RBT-Perfil.jpg" alt="RBT Internet">
        </div>

        <div>
            <h1>Indicadores Equipes Externas</h1>
            <p>
                Acompanhamento de desempenho, produtividade e metas das equipes.
            </p>
        </div>

    </div>

    <div class="hero-info">
        <div>Total de Técnicos</div>
        <strong>61</strong>
    </div>

</div>

<!-- TOP 3 -->

<div class="ranking-card">

    <div class="ranking-header">
        🏆 Ranking Geral - Top 3
    </div>

    <div class="top3-container">

        <div class="top3-item prata">
            <div class="medal">🥈</div>
            <div class="nome">Cristian Klein</div>
            <div class="pontos">289</div>
        </div>

        <div class="top3-item ouro">
            <div class="medal">🥇</div>
            <div class="nome">Lucas Rinker</div>
            <div class="pontos">294</div>
        </div>

        <div class="top3-item bronze">
            <div class="medal">🥉</div>
            <div class="nome">Daniel Correa</div>
            <div class="pontos">271</div>
        </div>

    </div>

</div>

<!-- INDICADORES -->

<div class="cards">

    <div class="card">
        <div class="card-title">Média Geral</div>
        <div class="card-value">166.5</div>
    </div>

    <div class="card">
        <div class="card-title">Meta Atingida</div>
        <div class="card-value">87%</div>
    </div>

    <div class="card">

        <div class="card-title">
            Consistência de Metas
        </div>

        <div class="consistencia">

            <div class="meta-box verde">
                <div>54%</div>
                <div>3/3</div>
            </div>

            <div class="meta-box amarelo">
                <div>22%</div>
                <div>2/3</div>
            </div>

            <div class="meta-box vermelho">
                <div>24%</div>
                <div>1/3</div>
            </div>

        </div>

    </div>

</div>
